name: Deploy Frontend to S3

on:
  push:
    branches: [dev]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'

jobs:
  deploy:
    runs-on: ubuntu-lastest

    steps:
        - name: Checkout code
          uses: actions/checkout@v4
        
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
                node-version: '18'
                cache: 'npm'
                cache-dependency-path: frontend/package-lock.json

        - name: Install dependencies
          run: npm ci
          working-directory: frontend

        - name: Build React app
          env:
            REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
            CI: false  # tắt treat-warnings-as-errors của CRA
          run: npm run build
          working-directory: frontend

        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@v4
          with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: ${{ secrets.AWS_REGION }}

        - name: Sync static assets to S3 (long-term cache)
          run: |
            aws s3 sync frontend/build s3://${{ secrets.S3_BUCKET_NAME }} \
            --delete \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"

        - name: Upload index.html to S3 (no cache)
          run: |
            aws s3 cp frontend/build/index.html \
            s3://${{ secrets.S3_BUCKET_NAME }}/index.html \
            --cache-control "no-cache,no-store,must-revalidate"

        - name: Invalidate CloudFront cache
          run: |
           aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
